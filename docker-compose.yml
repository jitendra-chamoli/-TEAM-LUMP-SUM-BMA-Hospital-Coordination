# Runs the whole system: MySQL + API server + AI service + dispatch orchestrator + client.
#
#   cp .env.docker.example .env      # then set MYSQL_ROOT_PASSWORD and JWT_SECRET
#   docker compose up --build
#   open http://localhost:3000
#
# The server creates all tables (and the demo ambulance fleet) on its first start.

name: bma

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-hospital_coordination}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"   # 3307 on the host so it doesn't clash with a local MySQL
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-hospital_coordination}
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      USER_APP_URL: ${USER_APP_URL:-http://localhost:3001}
      APP_TIMEZONE: ${TZ:-Asia/Kolkata}
      DISPATCH_FANOUT: ${DISPATCH_FANOUT:-5}
      DISPATCH_DEADLINE_SECONDS: ${DISPATCH_DEADLINE_SECONDS:-45}
      DISPATCH_CLAIM_WINDOW_MS: ${DISPATCH_CLAIM_WINDOW_MS:-2000}
      AMBULANCE_OFFER_FANOUT: ${AMBULANCE_OFFER_FANOUT:-3}
      AMBULANCE_OFFER_SECONDS: ${AMBULANCE_OFFER_SECONDS:-20}
      AMBULANCE_OFFER_ROUNDS: ${AMBULANCE_OFFER_ROUNDS:-3}
      TELEMETRY_TOKEN: ${TELEMETRY_TOKEN:-}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      OSRM_URL: ${OSRM_URL:-}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-}
      USE_DEMO_AMBULANCES: ${USE_DEMO_AMBULANCES:-true}
      GPS_STALE_MINUTES: ${GPS_STALE_MINUTES:-10}
      # Ranking hospitals for a public request goes through the dispatch service
      ORCHESTRATOR_URL: http://orchestrator:5001
      PUBLIC_REQUESTS_PER_DAY: ${PUBLIC_REQUESTS_PER_DAY:-5}
      PUBLIC_REQUESTS_PER_IP_PER_DAY: ${PUBLIC_REQUESTS_PER_IP_PER_DAY:-15}
      EMERGENCY_NUMBER: ${EMERGENCY_NUMBER:-108}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  orchestrator:
    build: ./hospital-orchestrator
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy   # the server owns the schema; wait for its migrations
      ai-service:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME:-hospital_coordination}
      PORT: 5001
      AI_IP: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      USE_DEMO_AMBULANCES: ${USE_DEMO_AMBULANCES:-true}
      GPS_STALE_MINUTES: ${GPS_STALE_MINUTES:-10}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "5001:5001"

  # Demo only: moves the sample ambulance fleet through the server's telemetry API.
  # Remove this service (or leave TELEMETRY_TOKEN empty) on a real deployment.
  simulator:
    build: ./simulator
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_URL: http://server:5000
      TELEMETRY_TOKEN: ${TELEMETRY_TOKEN:-}
      SIM_SPEED_KMH: ${SIM_SPEED_KMH:-50}
      SIM_SPEEDUP: ${SIM_SPEEDUP:-4}

  user-app:
    build:
      context: ./user-app
      args:
        # The address the browser uses to reach the API (not a container name)
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3001:80"

  client:
    build:
      context: ./client
      args:
        # Addresses the browser uses to reach the APIs (not container names)
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
        VITE_ORCHESTRATOR_URL: ${PUBLIC_ORCHESTRATOR_URL:-http://localhost:5001}
    restart: unless-stopped
    depends_on:
      - server
      - orchestrator
    ports:
      - "3000:80"

volumes:
  mysql-data:
